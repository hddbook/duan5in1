<!doctype html>
<html lang="vi">
<head>

<body>
  <header class="topbar">

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3a6.5 6.5 0 1 0 4.08 11.56L19 20l1-1-5.44-5.42A6.5 6.5 0 0 0 9.5 3Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm-.75 1.75v2h-2v1.5h2v2h1.5v-2h2v-1.5h-2v-2h-1.5Z"/></svg>
      </button>
      <button id="shareButton" class="icon-button" type="button" aria-label="Chia sẻ tài liệu" title="Chia sẻ">

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3H4Zm11-5h5v5h-2V6h-3V4ZM6 15v3h3v2H4v-5h2Zm12 0h2v5h-5v-2h3v-3Z"/></svg>

    </div>

  <main id="viewer" class="viewer" aria-live="polite">
    <div id="stage" class="stage">
      <div id="loading" class="loading" aria-hidden="true"></div>
      <img id="slide" src="assets/slides/slide-01.webp" alt="Trang 1 trên 47" width="1440" height="810" draggable="false">

    <div class="portrait-hint" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M7 1h10a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2Zm0 3v16h10V4H7Zm5 15a1 1 0 1 1 0-2 1 1 0 0 1 0 2ZM2.5 8.5 1 7l3.5-3.5L8 7 6.5 8.5 5.5 7.5A7 7 0 0 0 12 14h1v2h-1a9 9 0 0 1-8.5-6.1l-1 1Z"/></svg>
      <span>Xoay ngang để xem rõ hơn · Chạm đôi để phóng to</span>

  <nav class="controls" aria-label="Điều khiển trình chiếu">
    <button id="previousButton" class="nav-button" type="button" aria-label="Trang trước">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15.4 5.4-1.4-1.4-8 8 8 8 1.4-1.4L8.8 12l6.6-6.6Z"/></svg>

    <label class="page-control" for="pageRange">
      <span id="pageLabel">Trang 1 / 47</span>
      <input id="pageRange" type="range" min="1" max="47" value="1" step="1" aria-label="Chọn trang">

    <button id="nextButton" class="nav-button" type="button" aria-label="Trang sau">
      <span>Sau</span>

    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Bạn cần bật JavaScript để chuyển giữa các trang.</noscript>

</html>
